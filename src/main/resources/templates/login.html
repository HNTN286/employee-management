<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light py-5">
    <div class="container" style="max-width: 440px">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="h4 text-center fw-bold mb-3">Đăng nhập</h2>

            <div th:if="${param.error}" class="alert alert-danger py-2">Sai username hoặc password!</div>
            <div th:if="${param.logout}" class="alert alert-info py-2">Bạn đã đăng xuất thành công.</div>
            <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Tên đăng nhập</label>
                    <input name="username" class="form-control" placeholder="Nhập username" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Mật khẩu</label>
                    <input name="password" type="password" class="form-control" placeholder="Nhập password" required>
                </div>
                <button class="btn btn-primary w-100 py-2 fw-semibold">Đăng nhập</button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Chưa có tài khoản? <a th:href="@{/register}" class="text-decoration-none">Đăng ký mới</a>
            </p>
        </div>
    </div>
</body>

</html>
