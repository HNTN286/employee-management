<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Thống kê nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="container py-4">
    <!-- Top Navigation / User Info Bar -->
    <div class="navbar navbar-expand-lg bg-light rounded border px-3 py-2 mb-4 shadow-sm">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <span class="navbar-brand fw-bold mb-0">Hệ thống Quản lý Nhân viên</span>

            <div class="d-flex align-items-center gap-3">
                <!-- User Profile & Role Info -->
                <div class="d-flex align-items-center">
                    <span class="text-secondary me-2">Đang đăng nhập:</span>
                    <strong sec:authentication="name" class="me-2 text-dark">user</strong>

                    <!-- Role Badges -->
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger">ADMIN</span>
                    <span sec:authorize="hasRole('USER') and !hasRole('ADMIN')" class="badge bg-primary">USER</span>
                </div>

                <!-- Navigation link to Employee List -->
                <a th:href="@{/employees/list}" class="btn btn-outline-secondary btn-sm">Danh sách nhân viên</a>

                <!-- Logout Form (POST for CSRF safety) -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm"
                            onclick="return confirm('Bạn có chắc muốn đăng xuất?')">
                        Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Page Title and Back Button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Thống kê nhân viên</h1>
        <a th:href="@{/employees/list}" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
    </div>

    <!-- Tổng số nhân viên -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Tổng số nhân viên</h6>
                    <h2 class="card-text fw-bold text-primary mb-0" th:text="${totalEmployees}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Số phòng ban có nhân sự</h6>
                    <h2 class="card-text fw-bold text-success mb-0" th:text="${#lists.size(departmentStats)}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng thống kê theo phòng ban -->
    <h5 class="mb-3">Số lượng nhân viên theo phòng ban</h5>
    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col" style="width: 15%">STT</th>
                    <th scope="col" style="width: 55%">Phòng ban</th>
                    <th scope="col" style="width: 30%">Số lượng nhân viên</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat, iter : ${departmentStats}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <span class="fw-semibold" th:text="${stat.department}">IT</span>
                    </td>
                    <td>
                        <span class="badge bg-primary" th:text="${stat.total}">0</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departmentStats)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                        Chưa có dữ liệu thống kê nhân viên
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
