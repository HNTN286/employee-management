<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sửa nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="container py-4" style="max-width: 600px">
    <h1 class="mb-3">Sửa nhân viên</h1>
    <p th:if="${employeeCode}" class="text-muted">Mã nhân viên: <strong th:text="${employeeCode}"></strong></p>

    <form th:action="@{/employees/edit/{id}(id=${employeeId})}" th:object="${employeeRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input th:field="*{email}" class="form-control"
                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phòng ban</label>
            <select th:field="*{departmentId}" class="form-select"
                th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid'">
                <option value="">-- Chọn phòng ban --</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{departmentId}"></div>
        </div>
        <button class="btn btn-primary">Cập nhật</button>
        <a th:href="@{/employees/list}" class="btn btn-secondary">Hủy</a>
    </form>
</body>

</html>
