<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh sách nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="container py-4">
    <h1 class="mb-3">Danh sách nhân viên</h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form th:action="@{/employees/list}" method="get" class="row g-2 mb-3">
        <div class="col"><input name="name" th:value="${name}" class="form-control" placeholder="Tên nhân viên"></div>
        <div class="col"><input name="department" th:value="${department}" class="form-control" placeholder="Phòng ban">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Tìm kiếm</button>
            <a th:href="@{/employees/list}" class="btn btn-secondary">Xóa lọc</a>
        </div>
    </form>

    <a th:href="@{/employees/add}" class="btn btn-success mb-3">+ Thêm nhân viên</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Mã</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Phòng ban</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.code}"></td>
                <td th:text="${e.name}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.departmentName}"></td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/employees/edit/{id}(id=${e.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <form th:action="@{/employees/delete/{id}(id=${e.id})}" method="post"
                            onsubmit="return confirm('Xóa nhân viên này?')">
                            <button class="btn btn-sm btn-danger">Xóa</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" class="text-center">Không có dữ liệu</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
