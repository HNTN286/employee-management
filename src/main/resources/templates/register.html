<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light py-5">
    <div class="container" style="max-width: 440px">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="h4 text-center fw-bold mb-3">Đăng ký tài khoản</h2>
            <p class="text-center text-muted small mb-4">Tài khoản đăng ký mới sẽ mặc định có quyền <strong>USER</strong></p>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Tên đăng nhập</label>
                    <input th:field="*{username}" class="form-control" placeholder="Tối thiểu 3 ký tự"
                        th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Mật khẩu</label>
                    <input th:field="*{password}" type="password" class="form-control" placeholder="Tối thiểu 6 ký tự"
                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <button class="btn btn-primary w-100 py-2 fw-semibold">Đăng ký</button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập</a>
            </p>
        </div>
    </div>
</body>

</html>
