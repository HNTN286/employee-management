spring:
  application:
    name: employee-management
  profiles:
    active: dev
  jpa:
    open-in-view: false
  cache:
    type: caffeine
    cache-names: employeeStats
    caffeine:
      spec: expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized