spring:
  application:
    name: employee-management
  profiles:
    active: dev
  jpa:
    open-in-view: false
  cache:
    type: caffeine
    cache-names: employeeStats
    caffeine:
      spec: expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-key-at-least-32-characters-long!}"
    expiration-ms: 3600000